version: '3.8'
services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.0.5
    container_name: lavalink
    restart: always
    environment:
      - _JAVA_OPTIONS=-Xmx1G
      - SPRING_CONFIG_LOCATION=file:/opt/Lavalink/application.yml
    env_file:
      - .env
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml
    networks:
      - musicbots

  bot1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot1
    restart: always
    env_file:
      - .env
    networks:
      - musicbots
