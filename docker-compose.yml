  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: bots
  #   restart: always
  #   env_file:
  #     - .env
  #   depends_on:
  #     lavalink:
  #       condition: service_healthy

  #   networks:
  #     - musicbots

networks:
  musicbots:
    driver: bridge
volumes:

