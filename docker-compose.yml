version: '3.8'
services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: lavalink
    restart: unless-stopped
    environment:
      - SERVER_PORT=2333
      - LAVALINK_SERVER_PASSWORD=youshallnotpass
      - LAVALINK_SERVER_SOURCES_YOUTUBE=false
      - LAVALINK_PLUGINS_0_DEPENDENCY=dev.lavalink.youtube:youtube-plugin:1.11.4
      - LAVALINK_PLUGINS_0_REPOSITORY=https://maven.lavalink.dev/releases
      - PROXY_HOST=${PROXY_HOST}
      - PROXY_PORT=${PROXY_PORT}
      - PROXY_USER=${PROXY_USER}
      - PROXY_PASSWORD=${PROXY_PASSWORD}

    volumes:
      - ./application.yml:/opt/Lavalink/application.yml
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --header=\"Authorization: youshallnotpass\" --spider http://127.0.0.1:2333/version || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - musicbots
  bots:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bots
    restart: always
    depends_on:
      lavalink:
        condition: service_healthy

    networks:
      - musicbots

networks:
  musicbots:
    driver: bridge
volumes:
  redis_data:
